name: TypeScript SDK alpha release
on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful SDK qualification push run on main
        required: true
      artifact_sha256:
        description: Reviewed tarball SHA-256
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: npm-sdk-release
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.qualification_run }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          test "$REPO" = spryinc/spryplanner-sdk
          test "$(gh api "repos/$REPO" --jq .private)" = false
          gh api "repos/$REPO/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg repo "$REPO" '.repository.full_name == $repo and .path == ".github/workflows/sdk-ci.yml" and .event == "push" and .head_branch == "main" and .conclusion == "success"' "$RUNNER_TEMP/run.json"
          sha=$(jq -r .head_sha "$RUNNER_TEMP/run.json")
          gh api "repos/$REPO/commits/$sha/pulls" | jq -e 'any(.[]; .merged_at != null and .base.ref == "main")'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  validate:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: sdk-*
          merge-multiple: true
          path: artifacts/
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ github.token }}
      - name: Verify candidate and all release gates
        env:
          HASH: ${{ inputs.artifact_sha256 }}
        run: node tools/release.mjs artifacts "$HASH"
  publish:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    environment: npm-sdk-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          name: sdk-candidate
          path: artifacts/
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ github.token }}
      - name: Publish the approved immutable alpha with OIDC
        env:
          HASH: ${{ inputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const c=JSON.parse(fs.readFileSync("artifacts/candidate.json"));if(c.sha256!==process.env.HASH||crypto.createHash("sha256").update(fs.readFileSync("artifacts/"+c.filename)).digest("hex")!==process.env.HASH)throw Error("Checksum mismatch");'
          archive=$(node -p 'JSON.parse(require("fs").readFileSync("artifacts/candidate.json")).filename')
          npm publish "artifacts/$archive" --access public --tag alpha --provenance --ignore-scripts
