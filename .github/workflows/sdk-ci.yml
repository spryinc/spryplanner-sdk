name: SDK qualification

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verification-scope:
    name: Check verification changes
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    outputs:
      marker: ${{ steps.route.outputs.marker }}
      environment: ${{ steps.route.outputs.environment }}
      run_sdk_build: ${{ steps.route.outputs.run_sdk_build }}
      key_sdk_build: ${{ steps.route.outputs.key_sdk_build }}
      run_sdk_test: ${{ steps.route.outputs.run_sdk_test }}
      key_sdk_test: ${{ steps.route.outputs.key_sdk_test }}
      run_sdk_typecheck: ${{ steps.route.outputs.run_sdk_typecheck }}
      key_sdk_typecheck: ${{ steps.route.outputs.key_sdk_typecheck }}
      run_test_release_tools: ${{ steps.route.outputs.run_test_release_tools }}
      key_test_release_tools: ${{ steps.route.outputs.key_test_release_tools }}
      run_test_pnpm_tools: ${{ steps.route.outputs.run_test_pnpm_tools }}
      key_test_pnpm_tools: ${{ steps.route.outputs.key_test_pnpm_tools }}
      run_test_receipts: ${{ steps.route.outputs.run_test_receipts }}
      key_test_receipts: ${{ steps.route.outputs.key_test_receipts }}
      run_sdk: ${{ steps.route.outputs.run_sdk }}
      key_sdk: ${{ steps.route.outputs.key_sdk }}
      group_verify_sdk: ${{ steps.route.outputs.group_verify_sdk }}
      unresolved: ${{ steps.route.outputs.unresolved }}
      wait: ${{ steps.route.outputs.wait }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/verification-scope
        with:
          validate: "true"
      - id: route
        name: Decide fresh and carried verification
        env:
          GH_TOKEN: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.id == github.event.repository.id) && github.token || '' }}
          SELECTED: ${{ steps.scope.outputs.suites }}
        run: python3 -B .github/ci/github_updates.py route "$SELECTED"

  tested-candidate:
    name: Candidate
    needs: verification-scope
    uses: ./.github/workflows/ci-candidate.yml
    with:
      marker: ${{ needs.verification-scope.outputs.marker }}

  verify-sdk:
    name: Suites verify-sdk
    needs: [verification-scope, tested-candidate]
    if: needs.verification-scope.outputs.group_verify_sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: runner
        name: Match registered runner inputs
        env:
          EXPECTED: ${{ needs.verification-scope.outputs.environment }}
        run: python3 -B .github/ci/github_updates.py environment "$EXPECTED"
      - name: Record matching runner inputs
        if: steps.runner.outputs.matches == 'true'
        run: "true"
      - name: Record different runner inputs
        if: steps.runner.outputs.matches == 'false'
        run: "true"
      - id: pnpm-setup
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        if: >-
          needs.verification-scope.outputs.run_sdk_build == 'true' ||
          needs.verification-scope.outputs.run_sdk_test == 'true' ||
          needs.verification-scope.outputs.run_sdk_typecheck == 'true' ||
          needs.verification-scope.outputs.run_sdk == 'true'
        with:
          version: 11.1.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.17.0
          cache: ${{ steps.pnpm-setup.outcome == 'success' && 'pnpm' || '' }}
      - id: dependencies
        if: >-
          needs.verification-scope.outputs.run_sdk_build == 'true' ||
          needs.verification-scope.outputs.run_sdk_test == 'true' ||
          needs.verification-scope.outputs.run_sdk_typecheck == 'true' ||
          needs.verification-scope.outputs.run_sdk == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@v5
        if: steps.dependencies.outcome == 'success'
        with:
          path: |
            .verification
            packages/sdk-typescript/dist
          restore-keys: sdk-verify-${{ runner.os }}-24.17.0-
          key: sdk-verify-${{ runner.os }}-24.17.0-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'package.json', 'build.mjs', 'tsconfig.base.json', '.node-version', 'packages/**', 'tools/**') }}
      - id: ready
        run: "true"
      - name: "Execute selected suite: sdk-build"
        id: sdk-build
        if: "!cancelled() && steps.ready.outcome == 'success' && needs.verification-scope.outputs.run_sdk_build == 'true'"
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node tools/verify.mjs build
      - name: "Execute selected suite: sdk-test"
        id: sdk-test
        if: "!cancelled() && steps.ready.outcome == 'success' && needs.verification-scope.outputs.run_sdk_test == 'true'"
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node tools/verify.mjs test
      - name: "Execute selected suite: sdk-typecheck"
        id: sdk-typecheck
        if: "!cancelled() && steps.ready.outcome == 'success' && needs.verification-scope.outputs.run_sdk_typecheck == 'true'"
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node tools/verify.mjs typecheck
      - name: "Execute selected suite: test-release-tools"
        id: test-release-tools
        if: "!cancelled() && steps.ready.outcome == 'success' && needs.verification-scope.outputs.run_test_release_tools == 'true'"
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tools/release.test.mjs
      - name: "Execute selected suite: test-pnpm-tools"
        id: test-pnpm-tools
        if: "!cancelled() && steps.ready.outcome == 'success' && needs.verification-scope.outputs.run_test_pnpm_tools == 'true'"
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tools/find-pnpm.test.mjs
      - name: "Execute selected suite: test-receipts"
        id: test-receipts
        if: "!cancelled() && steps.ready.outcome == 'success' && needs.verification-scope.outputs.run_test_receipts == 'true'"
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test tools/verification/receipts.test.mjs
      - name: "Execute selected suite: sdk"
        id: sdk
        if: "!cancelled() && steps.ready.outcome == 'success' && needs.verification-scope.outputs.run_sdk == 'true'"
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.sdk-build.outcome }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$BUILD_RESULT" != success ]; then node tools/verify.mjs build; fi
          node tools/candidate.mjs
      - uses: actions/upload-artifact@v7
        if: "!cancelled() && steps.sdk.outcome == 'success'"
        with:
          name: sdk-candidate
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  install:
    needs: [verification-scope, verify-sdk]
    if: needs.verification-scope.outputs.run_sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned consumer pnpm client
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/spry-pnpm-client" pnpm@11.1.2 --ignore-scripts --no-audit --no-fund
          node -e 'const path=require("node:path"); console.log("PNPM_CLI="+path.join(process.env.RUNNER_TEMP,"spry-pnpm-client/node_modules/pnpm/bin/pnpm.mjs"))' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: sdk-candidate
          path: artifacts/
      - run: node tools/qualify-install.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-install-${{ runner.os }}
          path: artifacts/install-*.json
          if-no-files-found: error
          retention-days: 30

  required:
    name: SDK qualification gate
    if: always()
    needs: [verification-scope, tested-candidate, verify-sdk, install]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require selected verification
        env:
          SCOPE: ${{ needs.verification-scope.result }}
          MARKER: ${{ needs.tested-candidate.result }}
          GROUP_VERIFY_SDK_SELECTED: ${{ needs.verification-scope.outputs.group_verify_sdk }}
          GROUP_VERIFY_SDK_RESULT: ${{ needs.verify-sdk.result }}
          INSTALL_SELECTED: ${{ needs.verification-scope.outputs.run_sdk }}
          INSTALL_RESULT: ${{ needs.install.result }}
          UNRESOLVED: ${{ needs.verification-scope.outputs.unresolved }}
        run: |
          test "$SCOPE" = success && test "$MARKER" = success || exit 1
          test "$UNRESOLVED" = '[]' || { printf 'Unresolved verification: %s\n' "$UNRESOLVED"; exit 1; }
          pairs=("$GROUP_VERIFY_SDK_SELECTED:$GROUP_VERIFY_SDK_RESULT" "$INSTALL_SELECTED:$INSTALL_RESULT")
          for pair in "${pairs[@]}"; do
            case "$pair" in
              true:success|false:skipped) ;;
              *) exit 1 ;;
            esac
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.verification-scope.outputs.wait != '[]'
        with:
          persist-credentials: false
      - name: Await previously started verification
        if: needs.verification-scope.outputs.wait != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT: ${{ needs.verification-scope.outputs.wait }}
        run: python3 -B .github/ci/github_updates.py wait "$WAIT"
