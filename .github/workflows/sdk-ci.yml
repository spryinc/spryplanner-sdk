name: SDK qualification
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@v5
        with:
          path: |
            .verification
            packages/sdk-typescript/dist
          key: sdk-verify-${{ runner.os }}-24.17.0-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'package.json', 'build.mjs', 'tsconfig.base.json', '.node-version', 'packages/**', 'tools/**') }}
      - run: node tools/verify.mjs build
      - run: node tools/verify.mjs test
      - run: node tools/verify.mjs typecheck
      - run: node --test tools/release.test.mjs tools/verification/receipts.test.mjs
      - run: node tools/candidate.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-candidate
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Locate the pinned pnpm entry point
        shell: bash
        run: node tools/find-pnpm.mjs >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: sdk-candidate
          path: artifacts/
      - run: node tools/qualify-install.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-install-${{ runner.os }}
          path: artifacts/install-*.json
          if-no-files-found: error
          retention-days: 30
  required:
    name: SDK qualification gate
    if: always()
    needs: [build, install]
    runs-on: ubuntu-latest
    steps:
      - env:
          BUILD: ${{ needs.build.result }}
          INSTALL: ${{ needs.install.result }}
        run: test "$BUILD" = success && test "$INSTALL" = success
