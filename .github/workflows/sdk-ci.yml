name: SDK qualification
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification-scope:
    name: Check verification changes
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    outputs:
      product: ${{ steps.scope.outputs.product }}
      suites: ${{ steps.scope.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/verification-scope
        with:
          validate: "true"

  build:
    needs: verification-scope
    if: needs.verification-scope.outputs.product == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: contains(fromJSON(needs.verification-scope.outputs.suites), '*') || contains(fromJSON(needs.verification-scope.outputs.suites), 'sdk')
      - uses: actions/cache@v5
        if: contains(fromJSON(needs.verification-scope.outputs.suites), '*') || contains(fromJSON(needs.verification-scope.outputs.suites), 'sdk')
        with:
          path: |
            .verification
            packages/sdk-typescript/dist
          restore-keys: sdk-verify-${{ runner.os }}-24.17.0-
          key: sdk-verify-${{ runner.os }}-24.17.0-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'package.json', 'build.mjs', 'tsconfig.base.json', '.node-version', 'packages/**', 'tools/**') }}
      - run: node tools/verify.mjs build
        if: contains(fromJSON(needs.verification-scope.outputs.suites), '*') || contains(fromJSON(needs.verification-scope.outputs.suites), 'sdk')
      - run: node tools/verify.mjs test
        if: contains(fromJSON(needs.verification-scope.outputs.suites), '*') || contains(fromJSON(needs.verification-scope.outputs.suites), 'sdk')
      - run: node tools/verify.mjs typecheck
        if: contains(fromJSON(needs.verification-scope.outputs.suites), '*') || contains(fromJSON(needs.verification-scope.outputs.suites), 'sdk')
      - run: node --test tools/release.test.mjs tools/find-pnpm.test.mjs tools/verification/receipts.test.mjs
        if: contains(fromJSON(needs.verification-scope.outputs.suites), '*') || contains(fromJSON(needs.verification-scope.outputs.suites), 'sdk-tool-tests') || contains(fromJSON(needs.verification-scope.outputs.suites), 'sdk')
      - run: node tools/candidate.mjs
        if: contains(fromJSON(needs.verification-scope.outputs.suites), '*') || contains(fromJSON(needs.verification-scope.outputs.suites), 'sdk')
      - uses: actions/upload-artifact@v7
        if: contains(fromJSON(needs.verification-scope.outputs.suites), '*') || contains(fromJSON(needs.verification-scope.outputs.suites), 'sdk')
        with:
          name: sdk-candidate
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
  install:
    needs: [verification-scope, build]
    if: contains(fromJSON(needs.verification-scope.outputs.suites), '*') || contains(fromJSON(needs.verification-scope.outputs.suites), 'sdk')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned consumer pnpm client
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/spry-pnpm-client" pnpm@11.1.2 --ignore-scripts --no-audit --no-fund
          node -e 'const path=require("node:path"); console.log("PNPM_CLI="+path.join(process.env.RUNNER_TEMP,"spry-pnpm-client/node_modules/pnpm/bin/pnpm.mjs"))' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: sdk-candidate
          path: artifacts/
      - run: node tools/qualify-install.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-install-${{ runner.os }}
          path: artifacts/install-*.json
          if-no-files-found: error
          retention-days: 30
  required:
    name: SDK qualification gate
    if: always()
    needs: [verification-scope, build, install]
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE: ${{ needs.verification-scope.result }}
          PRODUCT_SELECTED: ${{ needs.verification-scope.outputs.product }}
          BUILD: ${{ needs.build.result }}
          INSTALL_SELECTED: ${{ contains(fromJSON(needs.verification-scope.outputs.suites), '*') || contains(fromJSON(needs.verification-scope.outputs.suites), 'sdk') }}
          INSTALL: ${{ needs.install.result }}
        run: |
          test "$SCOPE" = success || exit 1
          case "$PRODUCT_SELECTED" in
            true) test "$BUILD" = success ;;
            false) test "$BUILD" = skipped ;;
            *) exit 1 ;;
          esac
          case "$INSTALL_SELECTED" in
            true) test "$INSTALL" = success ;;
            false) test "$INSTALL" = skipped ;;
            *) exit 1 ;;
          esac
